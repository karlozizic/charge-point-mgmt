<html>
<head>
    <title>ChargePoint Simulator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #f8fafc;
            --accent-color: #0ea5e9;
            --success-color: #16a34a;
            --warning-color: #ca8a04;
            --danger-color: #dc2626;
            --background-color: #ffffff;
            --sidebar-bg: #f1f5f9;
            --card-bg: #f8fafc;
            --text-color: #1e293b;
            --border-radius: 6px;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --console-bg: #f8fafc;
            --console-text: #475569;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-layout {
            display: flex;
            flex: 1 1 auto;
            height: 100vh;
        }
        .sidebar {
            background: var(--sidebar-bg);
            min-width: 220px;
            max-width: 260px;
            padding: 24px 16px 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: var(--shadow);
        }
        .sidebar h1 {
            font-size: 1.2em;
            color: var(--primary-color);
            margin-bottom: 18px;
            text-align: left;
        }
        .sidebar .connection-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px 12px;
            box-shadow: var(--shadow);
        }
        .sidebar label {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 2px;
        }
        .sidebar input, .sidebar select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 7px 10px;
            border-radius: var(--border-radius);
            font-size: 13px;
            margin-bottom: 0;
        }
        .sidebar input[readonly] {
            background: #222b3a;
            color: #64748b;
            cursor: not-allowed;
        }
        .content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            padding: 32px 32px 24px 32px;
            gap: 0;
            min-width: 0;
            height: 100vh;
        }
        .main-controls-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .main-controls-row .tag-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 90px;
        }
        .main-controls-row label {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 2px;
        }
        .main-controls-row input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 7px 10px;
            border-radius: var(--border-radius);
            font-size: 13px;
            margin-bottom: 0;
        }
        .main-controls-row .charging-controls {
            display: flex;
            gap: 8px;
        }
        .connectors-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .connector-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 18px 16px 14px 16px;
            min-width: 260px;
            max-width: 340px;
            flex: 1 1 260px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .connector-card legend {
            color: var(--primary-color);
            font-size: 1em;
            padding: 0 6px;
        }
        .connector-card label {
            font-size: 12px;
            color: #cbd5e1;
        }
        .connector-card input, .connector-card select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 6px 8px;
            border-radius: var(--border-radius);
            font-size: 12px;
            margin-bottom: 0;
        }
        .connector-card button {
            margin-top: 4px;
        }
        .connector-card .charging-controls {
            gap: 6px;
            display: flex;
        }
        .console-card {
            background: transparent;
            color: var(--console-text);
            border-radius: 0;
            box-shadow: none;
            padding: 0 0 8px 0;
            min-height: 60px;
            max-height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 0;
            width: 100%;
        }
        #console {
            background: transparent;
            color: inherit;
            padding: 0 0 0 8px;
            border-radius: 0;
            height: auto;
            overflow-y: visible;
            font-family: inherit;
            list-style: none;
            margin: 0;
        }
        #console li {
            margin-bottom: 3px;
            border-bottom: 1px solid #2226;
            padding-bottom: 2px;
        }
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        button:hover {
            background: var(--accent-color);
        }
        button#connect {
            background: var(--success-color);
        }
        button#stop1, button#stop2 {
            background: var(--danger-color);
        }
        @media (max-width: 1100px) {
            .content {
                padding: 16px 4px 12px 4px;
            }
            .connectors-row {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
        }
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                max-width: 100vw;
                min-width: 0;
                flex-direction: row;
                gap: 12px;
                padding: 12px 8px;
            }
            .content {
                padding: 8px 2px 8px 2px;
            }
        }
    </style>
</head>

<body>
    <div class="main-layout">
        <aside class="sidebar">
            <h1>OCPP 1.6<br>Charger Simulator</h1>
            <div class="connection-info card">
                <div>
                    <label>Environment</label>
                    <select id="environment" onchange="updateCentralStation()">
                        <option value="ws://127.0.0.1:5000/OCPP" selected>Local</option>
                    </select>
                </div>
                <div>
                    <label>Charger ID</label>
                    <input id="chargerId" type="text" placeholder="Charger ID" value="CHGR-0010-HHI08" onchange="updateCentralStation()" />
                </div>
                <div>
                    <label>URL (Auto-generated)</label>
                    <input id="CP" type="text" class="FullLine" readonly />
                </div>
                <div>
                    <label>Password</label>
                    <input id="PASSWORD" type="text" class="FullLine" placeholder="Authentication" value=""/>
                </div>
            </div>
        </aside>
        <main class="content">
            <div class="main-controls-row">
                <div class="tag-group">
                    <label>Tag</label>
                    <input id="TAG" type="text" placeholder="Tag" value="1" />
                </div>
                <div class="charging-controls">
                    <button id="connect">Connect</button>
                    <button id="heartbeat">Heartbeat</button>
                    <button id="data_transfer">Data Transfer</button>
                    <button id="send">Authorize</button>
                </div>
            </div>
            <div class="connectors-row">
                <fieldset class="connector-card">
                    <legend><span id="connector1">Connector 1</span></legend>
                    <div class="charging-controls">
                        <button id="start1">Start</button>
                        <button id="stop1">Stop</button>
                    </div>
                    <label>Power.Active.Import</label>
                    <input id="pai1" type="text" placeholder="Meter value" value="1000" />
                    <label>State of Charge</label>
                    <input id="soc1" type="text" placeholder="SoC" value="23" oninput="handleSoCChange(1)"/>
                    <label>Status</label>
                    <select id="statusValue1">
                        <option selected value="Available">Available</option>
                        <option value="Preparing">Preparing</option>
                        <option value="Charging">Charging</option>
                        <option value="SuspendedEVSE">SuspendedEVSE</option>
                        <option value="SuspendedEV">SuspendedEV</option>
                        <option value="Finishing">Finishing</option>
                        <option value="Reserved">Reserved</option>
                        <option value="Unavailable">Unavailable</option>
                        <option value="Faulted">Faulted</option>
                    </select>
                    <button id="status1">Status</button>
                </fieldset>
                <fieldset class="connector-card">
                    <legend><span id="connector2">Connector 2</span></legend>
                    <div class="charging-controls">
                        <button id="start2">Start</button>
                        <button id="stop2">Stop</button>
                    </div>
                    <label>Power.Active.Import</label>
                    <input id="pai2" type="text" placeholder="Meter value" value="1000" />
                    <label>State of Charge</label>
                    <input id="soc2" type="text" placeholder="SoC" value="63" oninput="handleSoCChange(2)"/>
                    <label>Status</label>
                    <select id="statusValue2">
                        <option selected value="Available">Available</option>
                        <option value="Preparing">Preparing</option>
                        <option value="Charging">Charging</option>
                        <option value="SuspendedEVSE">SuspendedEVSE</option>
                        <option value="SuspendedEV">SuspendedEV</option>
                        <option value="Finishing">Finishing</option>
                        <option value="Reserved">Reserved</option>
                        <option value="Unavailable">Unavailable</option>
                        <option value="Faulted">Faulted</option>
                    </select>
                    <button id="status2">Status</button>
                </fieldset>
            </div>
            <div class="console-card">
                <ul id="console"></ul>
            </div>
        </main>
    </div>

    <script
            src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous"></script>

    <script>
        var possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        var _websocket = null;
        var connectorLocked = {1: false, 2: false};
        var pingInterval = null;
        var hbInterval = null;
        var bootRetryTimer = null;

        // Until BootNotification is Accepted the charge point may only answer the CSMS (OCPP 1.6 4.2.1).
        var bootPending = false;
        var bootAccepted = false;

        // Answers are matched on the CALL's uniqueId, which OCPP echoes in the CALLRESULT.
        var pendingStarts = {};

        // Reconnect backoff. Without it a closed gateway produces an unbounded retry loop, and two tabs
        // sharing a charger id close each other forever: the gateway drops the older socket with 1000.
        var RECONNECT_MAX_ATTEMPTS = 10;
        var RECONNECT_BASE_DELAY = 1000;
        var RECONNECT_MAX_DELAY = 30000;
        var reconnectAttempts = 0;
        var reconnectTimer = null;

        var batteryCapacity = {1: 50000, 2: 50000};
        var initialSoC = {1: $("#soc1").val(), 2: $("#soc2").val()};
        var currentSoC = {1: $("#soc1").val(), 2: $("#soc2").val()};
        var electricityConsumed = {1: 0, 2: 0};
        var meterValInterval = {1: null, 2: null};
        var meterValuesInterval = 15000;

        var READONLY_KEYS = ["NumberOfConnectors"];
        var configuration = {
            AllowOfflineTxForUnknownId: "false",
            HeartbeatInterval: "300",
            MeterValueSampleInterval: "15",
            NumberOfConnectors: "2"
        };

        function isConnector(connectorId) { return connectorId === 1 || connectorId === 2; }
        function isCharging(connectorId) { return sessionStorage.getItem('TransactionInProgress' + connectorId) === 'true'; }
        function transactionIdOf(connectorId) { return Number(sessionStorage.getItem('TransactionId' + connectorId)); }

        function connectorOfTransaction(transactionId) {
            if (isCharging(1) && transactionIdOf(1) === transactionId) return 1;
            if (isCharging(2) && transactionIdOf(2) === transactionId) return 2;
            return null;
        }

        function freeConnector() { return !isCharging(1) ? 1 : (!isCharging(2) ? 2 : null); }

        function configurationKeys() {
            var keys = [];
            for (var key in configuration) {
                keys.push({key: key, readonly: READONLY_KEYS.indexOf(key) >= 0, value: configuration[key]});
            }
            return keys;
        }

        function changeConfiguration(key, value) {
            if (!(key in configuration)) return "NotSupported";
            if (READONLY_KEYS.indexOf(key) >= 0) return "Rejected";

            if (key === "HeartbeatInterval" || key === "MeterValueSampleInterval") {
                var seconds = Number(value);
                if (!isFinite(seconds) || seconds <= 0) return "Rejected";
                configuration[key] = String(seconds);
                if (key === "HeartbeatInterval") startHB(seconds * 1000);
                else { meterValuesInterval = seconds * 1000; restartMeterTimers(); }
                return "Accepted";
            }

            configuration[key] = String(value);
            return "Accepted";
        }

        function handleSoCChange(connectorId) {
            const newSoC = document.getElementById("soc" + connectorId).value;
            initialSoC[connectorId] = newSoC;
            currentSoC[connectorId] = newSoC;
            electricityConsumed[connectorId] = 0;   // the old total was measured against the old baseline
        }

        function prepareMeterValues(connectorId) {
            var currentElectricityConsumed = electricityConsumed[connectorId];
            var currentLocalSoC = currentSoC[connectorId];
            var currentPower = Number(document.getElementById("pai" + connectorId).value);
            if (!isFinite(currentPower) || currentPower < 0) currentPower = 0;

            if (Number(currentLocalSoC) < 100) {
                currentElectricityConsumed = currentElectricityConsumed + (currentPower / 60000 / 60 * meterValuesInterval);
                currentLocalSoC = (((Number(initialSoC[connectorId]) / 100) * batteryCapacity[connectorId] + currentElectricityConsumed) / batteryCapacity[connectorId] * 100).toString();
                if (Number(currentLocalSoC) >= 100) {
                    currentSoC[connectorId] = '100';
                    document.getElementById("pai" + connectorId).value = '0';
                    document.getElementById("soc" + connectorId).value = '100'
                } else {
                    electricityConsumed[connectorId] = currentElectricityConsumed;
                    currentSoC[connectorId] = currentLocalSoC;
                    document.getElementById("soc" + connectorId).value = Math.round(Number(currentLocalSoC)).toString();
                }  
            }

            console.log("Preparing meter values:");
            console.log("electricity consumed -> " + electricityConsumed[connectorId]);
            console.log("current power -> " + document.getElementById("pai" + connectorId).value);
            console.log("current soc -> " + currentSoC[connectorId]);

            send_MeterValues(connectorId);
        }

        function formatDate(date) {
            var day = String(date.getUTCDate());
            if (day.length <2){
                day = ('0' + day.slice(-2));
            }

            var monthIndex = String(date.getUTCMonth()+1);
            if (monthIndex.length <2){
                monthIndex = ('0' + monthIndex.slice(-2));
            }
            var year = date.getUTCFullYear();
            var h = String(date.getUTCHours());
            var m = String(date.getUTCMinutes());
            var s = String(date.getUTCSeconds());


            if (h.length <2){
                h = ('0' + h.slice(-2));
            }
            if (m.length <2){
                m = ('0' + m.slice(-2));
            }
            if (s.length <2){
                s = ('0' + s.slice(-2));
            }
            return year + '-' + monthIndex + '-' + day+"T"+h+":"+m+":"+s+"Z";
        }

        function randomId() {
            var value = "";
            for (var i = 0; i < 36; i++) {
                value += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return value;
        }

        function generatePassword(bytesLength = 20) {
            if (bytesLength > 20 || bytesLength <= 0) {
                throw new Error("Bytes length should be between 1 and 20.");
            }
        
            const array = new Uint8Array(bytesLength);
            window.crypto.getRandomValues(array);
        
            return Array.from(array).map(b => b.toString(16).padStart(2, '0')).join(''); // Converts to hexadecimal
        }


        function wsConnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;

            var wsurl = $('#environment').val();
            var CP = $('#CP').val();
            
            var parts = CP.split('/');
            var username = parts[parts.length - 1];
            var password = $("#PASSWORD").val()
            

            if (_websocket) {
                setConnectionStatus(false);
                clearInterval(pingInterval);
                _websocket.close(3001);
            } else {
                var usernamePassword = username + ":" + password;
                var encodedUsernamePassword = btoa(usernamePassword);

                var queryParams = "auth=" + encodeURIComponent(encodedUsernamePassword);
                var wsUrlWithParams = wsurl + "/" + username + "?" + queryParams;

                _websocket = new WebSocket(wsUrlWithParams, ["ocpp1.6", "ocpp1.5", "simulator"]);
                _websocket.onopen = function (authorizationData) {
                    reconnectAttempts = 0;
                    bootAccepted = false;
                    setConnectionStatus(true, 1);
                    setConnectionStatus(true, 2);
                    BootNotification();

                    $('#connect').text('Disconnect').css('background', 'green');
                    startPing();
                };

                _websocket.onmessage = function (msg) {
                    var ddata = (JSON.parse(msg.data));

                    if (ddata[0] === 3 && bootPending) {
                        bootPending = false;
                        handleBootResponse(ddata[2] || {});
                        return;
                    }

                    if (ddata[0] === 3) {
                        if (pendingStarts[ddata[1]] !== undefined) {
                            var connectorId = pendingStarts[ddata[1]];
                            delete pendingStarts[ddata[1]];
                            var info = (ddata[2] || {}).idTagInfo;

                            if (info && info.status === 'Accepted') {
                                sessionStorage.setItem('TransactionId' + connectorId, ddata[2].transactionId);
                                beginCharging(connectorId);
                            } else {
                                logMsg("Transaction rejected: " + (info ? info.status : "no idTagInfo"));
                                abortStart(connectorId);
                            }
                        }

                        logMsg("Response: " + JSON.stringify(ddata[2]));

                    } else if (ddata[0] === 4) {
                        logMsg("CALLERROR " + ddata[2] + ": " + ddata[3]);
                    } else if (ddata[0] === 2) {
                        var serverId = ddata[1];
                        var req = ddata[3] || {};
                        logMsg("Request: " + ddata[2]);

                        switch (ddata[2]) {
                            case "GetConfiguration": {
                                var known = configurationKeys();
                                var wanted = req.key;
                                var answer = {configurationKey: wanted ? known.filter(function (k) { return wanted.indexOf(k.key) >= 0; }) : known};
                                if (wanted) {
                                    answer.unknownKey = wanted.filter(function (k) { return !(k in configuration); });
                                }
                                sendResult(serverId, answer);
                                break;
                            }

                            case "ChangeConfiguration":
                                sendResult(serverId, {status: changeConfiguration(req.key, req.value)});
                                break;

                            case "Reset":
                                sendResult(serverId, {status: "Accepted"});
                                setTimeout(function () { location.reload(); }, 500);
                                break;

                            case "RemoteStopTransaction": {
                                var stopConnector = connectorOfTransaction(req.transactionId);
                                sendResult(serverId, {status: stopConnector ? "Accepted" : "Rejected"});
                                if (stopConnector) stopTransaction(stopConnector, req.transactionId, "Remote");
                                break;
                            }

                            case "RemoteStartTransaction": {
                                var target = req.connectorId === undefined ? freeConnector() : req.connectorId;
                                var canStart = isConnector(target) && !isCharging(target);
                                sendResult(serverId, {status: canStart ? "Accepted" : "Rejected"});
                                if (canStart) startTransaction(target, req.idTag);
                                break;
                            }

                            case "UnlockConnector": {
                                if (!isConnector(req.connectorId)) {
                                    sendResult(serverId, {status: "UnlockFailed"});
                                    break;
                                }
                                if (isCharging(req.connectorId)) stopTransaction(req.connectorId, false, "UnlockCommand");
                                connectorLocked[req.connectorId] = false;
                                setTransactionStatus(req.connectorId, false);
                                sendResult(serverId, {status: "Unlocked"});
                                break;
                            }

                            case "ChangeAvailability": {
                                var scope = req.connectorId;
                                if (scope !== 0 && !isConnector(scope)) sendResult(serverId, {status: "Rejected"});
                                else if (isCharging(1) || isCharging(2)) sendResult(serverId, {status: "Scheduled"});
                                else sendResult(serverId, {status: "Accepted"});
                                break;
                            }

                            case "SetChargingProfile":
                                sendResult(serverId, {status: req.csChargingProfiles ? "Accepted" : "Rejected"});
                                break;

                            default:
                                sendError(serverId, "NotImplemented", "Unknown action " + ddata[2]);
                                break;
                        }
                    }
                };

                _websocket.onclose = function (evt) {
                    $('#connect').text('Connect').css('background', '#369');
                    stopAllTimers();
                    clearPendingStarts();
                    _websocket = null;
                    bootPending = false;
                    bootAccepted = false;
                    setConnectionStatus(false, 1);
                    setConnectionStatus(false, 2);

                    if (evt.code == 3001) {
                        logMsg('ws closed');
                        reconnectAttempts = 0;
                        return;
                    }

                    // The gateway closes the previous socket with 1000 when the same charger id
                    // connects again. Reconnecting here would make two tabs evict each other forever.
                    if (evt.code == 1000) {
                        logMsg('ws closed by the server (1000). Not reconnecting — another tab may hold this charger id.');
                        reconnectAttempts = 0;
                        return;
                    }

                    if (reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
                        logMsg('ws connection error: ' + evt.code + '. Giving up after ' + reconnectAttempts + ' attempts; press Connect to retry.');
                        reconnectAttempts = 0;
                        return;
                    }

                    var delay = Math.min(RECONNECT_BASE_DELAY * Math.pow(2, reconnectAttempts), RECONNECT_MAX_DELAY);
                    reconnectAttempts++;
                    logMsg('ws connection error: ' + evt.code + '. Reconnect attempt ' + reconnectAttempts + ' in ' + Math.round(delay / 1000) + 's.');
                    reconnectTimer = setTimeout(wsConnect, delay);
                };

                _websocket.onerror = function (evt) {
                    // onclose may already have cleared the socket when a late error arrives.
                    if (_websocket && _websocket.readyState == 1) {
                        setConnectionStatus(false);
                        logMsg('ws normal error: ' + evt.type);
                    }
                };
            }
        }

        function logMsg(err) {
            console.log(err);
            $('#console').append('<li>' + err + '</li>');
        }

        function Authorize(){
            sendCall("Authorize", {idTag: $("#TAG").val()});
        }
     
        // A transaction only exists once the CSMS answers Accepted. Until then this function must not
        // set TransactionInProgress, report Charging, or start the meter timer: a rejected tag would
        // leave the timer running forever, sending MeterValues under a stale or missing transaction id.
        function startTransaction(connectorId, idTag = null){
            connectorId = parseInt(connectorId);
            connectorLocked[connectorId] = true;
            document.getElementById("soc" + connectorId).setAttribute('readonly', true);

            // added because of anonymous users
            if (idTag == null) {
                idTag = $("#TAG").val();
            }
            else
            {
                sessionStorage.setItem('idTag', idTag);
            }

            var callId = sendCall("StartTransaction", {
                connectorId: connectorId,
                idTag: idTag,
                timestamp: formatDate(new Date()),
                meterStart: 0
            });

            if (callId === null) { abortStart(connectorId); return; }
            pendingStarts[callId] = connectorId;
        }

        // Called from the StartTransaction CALLRESULT once the CSMS accepted the tag.
        function beginCharging(connectorId){
            connectorId = parseInt(connectorId);
            sessionStorage.setItem('TransactionInProgress'+connectorId, true);
            setTransactionStatus(connectorId, true);

            document.getElementById("statusValue" + connectorId).value = "Charging";
            send_StatusNotification(connectorId);
            startMeterTimer(connectorId);
        }

        function startMeterTimer(connectorId){
            clearInterval(meterValInterval[connectorId]);
            meterValInterval[connectorId] = setInterval(function () {
                prepareMeterValues(connectorId);
            }, meterValuesInterval);
        }

        function restartMeterTimers(){
            if (meterValInterval[1]) startMeterTimer(1);
            if (meterValInterval[2]) startMeterTimer(2);
        }

        // Called when the CSMS rejected the tag. Undoes what startTransaction changed.
        function abortStart(connectorId){
            connectorId = parseInt(connectorId);
            connectorLocked[connectorId] = false;
            document.getElementById("soc" + connectorId).removeAttribute('readonly');
            sessionStorage.setItem('TransactionInProgress'+connectorId, false);
            sessionStorage.removeItem('TransactionId'+connectorId);
            setTransactionStatus(connectorId, false);
        }

        function stopTransaction(connectorId, transaction_id = false, reason = "Local"){
            connectorId = parseInt(connectorId);
            var ssid = transaction_id === false ? sessionStorage.getItem('TransactionId' + connectorId) : transaction_id;
            if (ssid === null || isNaN(parseInt(ssid))) {
                logMsg("No transaction to stop on connector " + connectorId);
                return;
            }

            connectorLocked[connectorId] = false;
            document.getElementById("soc" + connectorId).removeAttribute('readonly');
            setConnectionStatus(true, connectorId);

            // added because of anonymous users
            var idTag = sessionStorage.getItem('idTag');
            if (idTag == null) idTag = $("#TAG").val();

            clearInterval(meterValInterval[connectorId]);
            meterValInterval[connectorId] = null;
            sessionStorage.setItem('TransactionInProgress' + connectorId, false);
            sessionStorage.removeItem('TransactionId' + connectorId);

            sendCall("StopTransaction", {
                transactionId: parseInt(ssid),
                idTag: idTag,
                timestamp: formatDate(new Date()),
                meterStop: Math.round(electricityConsumed[connectorId]),
                reason: reason
            });

            electricityConsumed[connectorId] = 0;
            document.getElementById("statusValue" + connectorId).value = "Available";
            send_StatusNotification(connectorId);
        }

        function BootNotification(){
            bootPending = true;
            logMsg('ws connected');
            sendCall("BootNotification", {
                chargePointVendor: "AVT-Company",
                chargePointModel: "AVT-Express",
                chargePointSerialNumber: "avt.001.13.1",
                chargeBoxSerialNumber: "avt.001.13.1.01",
                firmwareVersion: "0.9.87",
                meterType: "AVT NQC-ACDC",
                meterSerialNumber: "avt.001.13.1.01"
            });
        }

        // Accepted: normal operation. Pending or Rejected: send nothing but answers, and try again
        // after `interval` seconds (OCPP 1.6 4.2.1).
        function handleBootResponse(conf){
            logMsg("BootNotification " + conf.status + ", interval " + conf.interval + "s");
            sessionStorage.setItem("Configuration", conf.interval);

            if (conf.status === "Accepted") {
                bootAccepted = true;
                startHB(Number(conf.interval) * 1000);
                send_StatusNotification(1);
                send_StatusNotification(2);
                return;
            }

            bootAccepted = false;
            stopAllTimers();
            var retry = Math.max(Number(conf.interval) || 10, 1) * 1000;
            bootRetryTimer = setTimeout(function () { if (socketReady()) BootNotification(); }, retry);
        }

        function startHB(interval){
            interval = isNaN(interval) || !interval ? 30000 : interval;
            logMsg("Setting heartbeat interval to "+interval);
            clearInterval(hbInterval);
            hbInterval = setInterval(send_heartbeat, interval);
        }

        function socketReady() {
            return _websocket && _websocket.readyState === WebSocket.OPEN;
        }

        function sendCall(action, payload) {
            if (!socketReady()) {
                logMsg(action + " not sent: no connection.");
                return null;
            }
            if (!bootAccepted && action !== "BootNotification") {
                logMsg(action + " not sent: BootNotification is not Accepted.");
                return null;
            }
            var callId = randomId();
            _websocket.send(JSON.stringify([2, callId, action, payload]));
            return callId;
        }

        function sendResult(uniqueId, payload) {
            if (socketReady()) _websocket.send(JSON.stringify([3, uniqueId, payload]));
        }

        // CALLERROR is [4, uniqueId, errorCode, errorDescription, errorDetails].
        function sendError(uniqueId, errorCode, description) {
            if (socketReady()) _websocket.send(JSON.stringify([4, uniqueId, errorCode, description, {}]));
        }

        // Every timer the socket owns. Leaving one running after a close makes it call send() on null.
        function clearPendingStarts() {
            for (var callId in pendingStarts) {
                abortStart(pendingStarts[callId]);
            }
            pendingStarts = {};
        }

        function stopAllTimers() {
            clearTimeout(bootRetryTimer);
            bootRetryTimer = null;
            clearInterval(pingInterval);
            pingInterval = null;
            clearInterval(hbInterval);
            hbInterval = null;
            for (var connectorId in meterValInterval) {
                clearInterval(meterValInterval[connectorId]);
                meterValInterval[connectorId] = null;
            }
        }

        function send_heartbeat() {
            if (!socketReady()) {
                clearInterval(hbInterval);
                hbInterval = null;
                return;
            }
            sendCall("Heartbeat", {});
        }
        
        function send_MeterValues(connectorId)
        {
            connectorId = parseInt(connectorId);
            var power = Number($("#pai" + connectorId).val());
            if (!isFinite(power) || power < 0) power = 0;

            var payload = {
                connectorId: connectorId,
                meterValue: [{
                    timestamp: formatDate(new Date()),
                    sampledValue: [
                        {value: String(Math.round(electricityConsumed[connectorId])), measurand: "Energy.Active.Import.Register", unit: "Wh", context: "Sample.Periodic"},
                        {value: String(power), measurand: "Power.Active.Import", unit: "W", context: "Sample.Periodic"},
                        {value: String(Math.round(Number(currentSoC[connectorId]) || 0)), measurand: "SoC", unit: "Percent", context: "Sample.Periodic"}
                    ]
                }]
            };

            if (isCharging(connectorId)) payload.transactionId = transactionIdOf(connectorId);
            sendCall("MeterValues", payload);
        }

        function send_StatusNotification(connectorId)
        {
            sendCall("StatusNotification", {
                connectorId: parseInt(connectorId),
                status: String($("#statusValue" + connectorId).val()),
                errorCode: "NoError",
                timestamp: formatDate(new Date())
            });
        }

        function setConnectionStatus(connected, connectorId)
        {
            if (connected)
            {
                setTransactionStatus(connectorId, false);
            }
            else
            {
                $('#connector'+connectorId).css("background-color", "");
            }
        }

        function setTransactionStatus(connectorId, active)
        {
            if (active){
                $('#connector'+connectorId).css("background-color", "green");
            }

            else{
                $('#connector'+connectorId).css("background-color", "#C0C000");
            }

        }

        function startPing() {
            pingInterval = setInterval(function() {
                if (_websocket && _websocket.readyState === WebSocket.OPEN) {
                    _websocket.send('ping'); // Sending a simple "ping" message
                    logMsg('Ping sent to the server');
                }
            }, 20000);
        }

        $( document ).ready(function() {
            setConnectionStatus(false);

            //bind controls
            $('#connect').click(function () {
                $('#console').html("");
                wsConnect();
            });

            $('#send').click(function () {
                Authorize();
            });

            $('#start1').click(function () {
                startTransaction(1);
            });
            $('#start2').click(function () {
                startTransaction(2);
            });

            $('#stop1').click(function () {
                stopTransaction(1);
            });
            $('#stop2').click(function () {
                stopTransaction(2);
            });

            $('#mv1').click(function () {
                send_MeterValues(1);
            });
            $('#mv2').click(function () {
                send_MeterValues(2);
            });

            $('#heartbeat').click(function () {
                send_heartbeat();
            });

            $('#status1').click(function () {
                send_StatusNotification(1);
            });
            $('#status2').click(function () {
                send_StatusNotification(2);
            });

            $('#data_transfer').click(function () {
                sendCall("DataTransfer", {
                    vendorId: "rus.avt.cp",
                    messageId: "GetChargeInstruction"
                });
            });

            $('#connect').on('change', function () {
                if (_websocket) {
                    _websocket.close(3001);
                }
            });
        });

        // Add the updateCentralStation function
        function updateCentralStation() {
            const environment = document.getElementById('environment').value;
            const chargerId = document.getElementById('chargerId').value;
            document.getElementById('CP').value = environment + '/' + chargerId;
        }
        // Initialize on page load
        updateCentralStation();
    </script>

</body>
